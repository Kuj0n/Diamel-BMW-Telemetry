[env:esp32-s3]
; Wersje przypięte - aktualizacja platformy/bibliotek tylko świadomie (zmiany API psuły kompilację)
platform = platformio/espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags = 
    -DBOARD_HAS_PSRAM
    -I lib
    -DLV_CONF_SKIP=1
    -DLV_COLOR_DEPTH=16
    ; LVGL: czas z millis(), pamięć obiektów w PSRAM (include/lv_mem_psram.h), ciemny motyw
    -I include
    -DLV_TICK_CUSTOM=1
    -DLV_MEM_CUSTOM=1
    '-D LV_MEM_CUSTOM_INCLUDE="lv_mem_psram.h"'
    -DLV_MEM_CUSTOM_ALLOC=lv_psram_alloc
    -DLV_MEM_CUSTOM_REALLOC=lv_psram_realloc
    -DLV_MEM_CUSTOM_FREE=lv_psram_free
    -DLV_THEME_DEFAULT_DARK=1
    ; Odświeżanie ekranu i odczyt dotyku co 20 ms (jak w przykładach producenta)
    -DLV_DISP_DEF_REFR_PERIOD=20
    -DLV_INDEV_DEF_READ_PERIOD=20
    ; Dodatkowe rozmiary czcionek
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_32=1
    -DLV_FONT_MONTSERRAT_48=1
    ; Kod QR na stronie Wi-Fi (dołączenie telefonu do sieci)
    -DLV_USE_QRCODE=1
    ; Serwer WWW (AsyncTCP) na rdzeniu 0 - rdzeń 1 zostaje dla grafiki
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    ; Optymalizacja pod szybkość zamiast rozmiaru (płynniejsza grafika)
    -O2

build_unflags = -Os

lib_ldf_mode = deep

lib_deps =
    FS
    WiFi
    ; LVGL 9 ma inne API - zostajemy na 8.x
    lvgl/lvgl @ 8.4.0
    moononournation/GFX Library for Arduino @ 1.6.9
    ; Utrzymywane wersje (repozytoria me-no-dev są porzucone)
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    bblanchon/ArduinoJson @ 7.4.3