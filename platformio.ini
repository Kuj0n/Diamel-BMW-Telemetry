[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I lib
    -DLV_CONF_SKIP=1
    -DLV_COLOR_DEPTH=16
    ; LVGL: czas z millis(), pamięć z malloc (PSRAM), ciemny motyw
    -DLV_TICK_CUSTOM=1
    -DLV_MEM_CUSTOM=1
    -DLV_THEME_DEFAULT_DARK=1
    ; Odświeżanie ekranu i odczyt dotyku co 20 ms (jak w przykładach producenta)
    -DLV_DISP_DEF_REFR_PERIOD=20
    -DLV_INDEV_DEF_READ_PERIOD=20
    ; Dodatkowe rozmiary czcionek
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_32=1
    -DLV_FONT_MONTSERRAT_48=1
    ; Licznik FPS i obciążenia CPU w prawym dolnym rogu (diagnostyka, do wyłączenia później)
    -DLV_USE_PERF_MONITOR=1
    ; Optymalizacja pod szybkość zamiast rozmiaru (płynniejsza grafika)
    -O2

build_unflags = -Os

lib_ldf_mode = deep

lib_deps =
    FS
    WiFi
    lvgl/lvgl @ ^8.3.9
    https://github.com/moononournation/Arduino_GFX.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    bblanchon/ArduinoJson @ ^6.21.3